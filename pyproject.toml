[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-core-estimate-demo"
version = "0.1.0"
description = "Robomaster exchange perception, dataset composition, and keypoint tools"
requires-python = ">=3.10,<3.11"
dependencies = [
    "albumentations==2.0.8",
    "mmcv==2.1.0",
    "mmdet==3.2.0",
    "mmengine==0.10.7",
    "mmpose==1.3.2",
    "ninja>=1.11",
    "numpy==2.2.6",
    "onnx>=1.17",
    "onnxruntime==1.23.2",
    "onnxscript>=0.5",
    "opencv-python==4.11.0.86",
    "opencv-python-headless==4.11.0.86",
    "openvino==2025.4.1",
    "pip>=24",
    "pyyaml==6.0.3",
    "setuptools>=69,<81",
    "tensorboard>=2.15",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "tqdm==4.70.0",
    "typing-extensions>=4.4",
    "ultralytics==8.4.46",
    "wheel>=0.43",
    "xtcocotools==1.14.3",
]

[project.scripts]
rm-nn = "nn.__main__:main"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv]
package = true

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
    "dataset_augment",
    "perception",
    "nn",
    "nn.hrnet",
    "nn.hrnet.custom",
    "nn.hrnet.data",
    "nn.hrnet.tools",
    "nn.yolo",
    "nn.yolo.train",
]

[tool.setuptools.package-data]
dataset_augment = ["README.md", "configs/*.yaml"]

[[tool.uv.dependency-metadata]]
name = "chumpy"
version = "0.70"
requires-dist = ["scipy>=0.13.0", "six>=1.11.0"]

[[tool.uv.dependency-metadata]]
name = "mmcv"
version = "2.1.0"
requires-dist = [
    "addict",
    "mmengine>=0.3.0",
    "numpy",
    "packaging",
    "Pillow",
    "pyyaml",
    "regex; sys_platform == 'win32'",
    "yapf",
]

[tool.mypy]
python_version = "3.10"
python_executable = ".venv/bin/python"
files = ["src/blender", "src/nn", "src/perception", "src/dataset_augment"]
strict = true
follow_imports = "silent"
show_error_codes = true

# These runtime libraries do not publish complete PEP 561 type information.
# Keep missing-import exceptions at their boundary, not across project code.
[[tool.mypy.overrides]]
module = [
    "albumentations.*",
    "bpy.*",
    "bpy_extras.*",
    "mathutils.*",
    "mmcv.*",
    "mmengine.*",
    "mmpose.*",
    "openvino.*",
    "pycocotools.*",
    "tqdm.*",
    "ultralytics.*",
    "xtcocotools.*",
    "yaml.*",
]
ignore_missing_imports = true

# Upstream MMCV/MMPose base classes are untyped; their local subclasses still
# require fully annotated methods and are checked under all other strict rules.
[[tool.mypy.overrides]]
module = ["nn.hrnet.custom.albumentation", "nn.hrnet.custom.visibility_head"]
disallow_subclassing_any = false

# Historical experimental loss check references an upstream module that was
# never included in this checkout; this does not make that script runnable.
[[tool.mypy.overrides]]
module = ["pillar_models"]
ignore_missing_imports = true
